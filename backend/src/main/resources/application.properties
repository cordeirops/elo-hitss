quarkus.application.name=elo-feedback
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# O frontend (Vue) compilado fica em META-INF/resources e e servido na raiz "/".
# Em desenvolvimento, use o servidor do Vite (porta 5173) com proxy para /api.

# Tempo de vida de uma sessao (horas). Usado pelo SessionRegistry.
elo.session.hours=8

# CORS: o front na Vercel chama o backend direto (VITE_API_URL).
# Defina CORS_ORIGINS no projeto do backend, ex: https://SEU-FRONT.vercel.app
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Segredo para assinar os tokens de sessao. Defina ELO_SESSION_SECRET no projeto do backend.
elo.session.secret=${ELO_SESSION_SECRET:elo-demo-secret-troque-em-producao}
